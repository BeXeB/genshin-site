@if (view$ | async; as view) {
  <div class="entry-table weapon-table">
    <div class="table-row table-head">
      <div class="cell icon-cell"></div>
      <div class="cell name-cell"><b>Name</b></div>
      <div class="level-groups">
        <div class="head-row">
          <div class="cell group-cell">Level</div>
        </div>
        <div class="head-row head-sub-row">
          <div class="cell">Current</div>
          <div class="cell">Goal</div>
        </div>
      </div>
      <div class="cell action-cell"></div>
    </div>

    @for (row of view.rows; track row.progress.weaponId) {
      <app-entry-row
        [name]="row.name"
        [expanded]="isExpanded(row.progress.weaponId)"
        [cost]="calculatedCost"
        (nameClicked)="onRowClicked(row)"
        (removed)="onRemoveWeapon(row.progress.weaponId)"
      >
        <div class="cell icon-cell" entryIcon>
          <img class="character-icon" [src]="row.iconUrl" [alt]="row.name" />
        </div>

        <div class="cell level-cell">
          <app-select-dropdown
            [label]="row.name + ' level'"
            [options]="row.levelOptions"
            [value]="row.progress.currentLevel"
            (valueChange)="onLevelChange(row.progress, 'currentLevel', $event)"
          />
        </div>

        <div class="cell level-cell">
          <app-select-dropdown
            [label]="row.name + ' level goal'"
            [options]="row.levelOptions"
            [value]="row.progress.goalLevel"
            (valueChange)="onLevelChange(row.progress, 'goalLevel', $event)"
          />
        </div>
      </app-entry-row>
    } @empty {
      <div class="empty-table">No weapons yet</div>
    }
  </div>

  <app-character-search
    class="add-search"
    placeholder="+ Add weapon"
    [characters]="view.available"
    (characterSelected)="onAddWeapon($event)"
  />
}
