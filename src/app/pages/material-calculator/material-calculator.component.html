<div class="material-calculator-container">
  <app-page-title [title]="'Material Calculator'" [backLink]="'/tools'"></app-page-title>

  <div class="button-group">
    <button
      class="button"
      routerLink="/material-calculator"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Materials
    </button>
    <button class="button" routerLink="/material-calculator/characters" routerLinkActive="active">
      Characters
    </button>
    <button class="button" routerLink="/material-calculator/weapons" routerLinkActive="active">
      Weapons
    </button>
    <button class="button" routerLink="/material-calculator/inventory" routerLinkActive="active">
      Inventory
    </button>
  </div>

  <router-outlet />
</div>
