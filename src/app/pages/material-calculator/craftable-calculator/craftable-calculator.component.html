@if (view$ | async; as view) {
  <div class="entry-table craftable-table">
    <div class="table-row table-head">
      <div class="cell icon-cell"></div>
      <div class="cell name-cell"><b>Fegyver</b></div>
      <div class="cell billet-cell"><b>Billet</b></div>
      <div class="cell refine-cell"><b>Jelenlegi</b></div>
      <div class="cell refine-cell"><b>Cél</b></div>
      <div class="cell action-cell"></div>
    </div>

    @for (row of view.rows; track row.progress.instanceId) {
      <app-entry-row [name]="row.weapon.name" (removed)="onRemoveCraftable(row.progress.instanceId)">
        <div class="cell icon-cell" entryIcon>
          <img class="character-icon" [src]="row.iconUrl" [alt]="row.weapon.name" />
        </div>
        <div class="cell billet-cell">{{ row.billetName }}</div>
        <div class="cell refine-cell">
          <app-select-dropdown
            [label]="row.weapon.name + ' jelenlegi finomítás'"
            [options]="view.refineOptions"
            [value]="row.progress.currentRefine"
            (valueChange)="onRefineChange(row.progress, 'currentRefine', $event)"
          />
        </div>
        <div class="cell refine-cell">
          <app-select-dropdown
            [label]="row.weapon.name + ' cél finomítás'"
            [options]="view.refineOptions"
            [value]="row.progress.goalRefine"
            (valueChange)="onRefineChange(row.progress, 'goalRefine', $event)"
          />
        </div>
      </app-entry-row>
    } @empty {
      <div class="empty-table">Még nincs craftolható fegyver</div>
    }
  </div>

  <app-character-search
    class="add-search"
    placeholder="Craftolható fegyver hozzáadása"
    [characters]="view.available"
    (characterSelected)="onAddCraftable($event)"
  />
}
