@if (view$ | async; as view) {
  @if (view.isEmpty) {
    <div class="empty-table">
      Adj hozzá karaktereket, fegyvereket vagy készíthető fegyvereket, hogy lásd a szükséges
      materiálokat
    </div>
  } @else {
    <app-material-cost-display
      [cost]="view.cost"
      [groupByType]="true"
      [ownedMaterials]="view.ownedMaterials"
    />
  }
}
